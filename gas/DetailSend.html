<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --brand: #381E19; --line: #ddd; --muted: #777; --bg: #faf7f5; --err: #c62828; --warn: #8a5a00; }
  * { box-sizing: border-box; }
  body { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 13px; margin: 0; padding: 12px 16px 80px; color: #222; }
  h2 { font-size: 14px; margin: 12px 0 6px; color: var(--brand); }
  label.l { display: block; font-size: 11px; color: var(--muted); margin: 6px 0 2px; }
  input[type=text], select, textarea { width: 100%; font: inherit; padding: 5px 6px; border: 1px solid var(--line); border-radius: 4px; background: #fff; }
  textarea { resize: vertical; }
  .cols { display: flex; gap: 16px; }
  .cols > div { flex: 1; min-width: 0; }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; min-width: 0; }
  .staff { border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; background: var(--bg); max-height: 170px; overflow: auto; }
  .staff label { display: block; padding: 3px 0; }
  .sent { color: var(--warn); font-size: 11px; }
  .got { color: #2e7d32; font-size: 11px; }
  .preview { white-space: pre-wrap; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: #fff; font-size: 12px; max-height: 330px; overflow: auto; }
  .bubble { background: #e9f8e5; border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; }
  button { font: inherit; padding: 7px 16px; border-radius: 4px; border: 1px solid var(--brand); background: #fff; color: var(--brand); cursor: pointer; }
  button.primary { background: var(--brand); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .msg { margin: 8px 0; padding: 8px 10px; border-radius: 4px; display: none; white-space: pre-wrap; }
  .msg.err { display: block; background: #fdecea; color: var(--err); }
  .msg.info { display: block; background: #eef6ee; color: #2e7d32; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px; background: #fff; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
  .hint { color: var(--muted); font-size: 11px; }
  input[type=tel] { width: 100%; font: inherit; padding: 5px 6px; border: 1px solid var(--line); border-radius: 4px; }
  .images { display: flex; gap: 8px; flex-wrap: wrap; margin: 2px 0 6px; }
  .thumb { position: relative; width: 96px; height: 96px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #f3f3f3; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb button { position: absolute; top: 2px; right: 2px; padding: 0 6px; font-size: 12px; line-height: 18px; border-radius: 9px; background: rgba(0,0,0,.6); color: #fff; border: none; }
  .pick { display: inline-block; padding: 5px 12px; border: 1px dashed var(--brand); border-radius: 4px; color: var(--brand); cursor: pointer; font-size: 12px; }
  .pick.off { opacity: .4; pointer-events: none; }
  .bubble img { max-width: 160px; max-height: 160px; border-radius: 6px; display: block; }
</style>
</head>
<body>
  <div id="msg" class="msg"></div>
  <div id="empty" class="hint" style="display:none">詳細連絡を送れる案件がありません。「案件応募」で状態を「確定」にした人が対象です（日程が過ぎた案件は出ません）。</div>
  <div id="main" style="display:none">
    <label class="l" for="case">案件</label>
    <select id="case"></select>
    <div class="cols">
      <div>
        <h2>連絡する内容</h2>
        <div class="hint">「案件一覧」の内容を入れてあります。日程と時間は、一人ひとりの確定した日程が入ります。</div>
        <div class="row"><div><label class="l">タイトル</label><input type="text" data-f="title"></div><div><label class="l">業務内容</label><input type="text" data-f="work"></div></div>
        <label class="l">場所</label><input type="text" data-f="place">
        <label class="l">時間の注意書き（「※」の後に入ります）</label><input type="text" data-f="timeNote" placeholder="例：多少前後する可能性があります。">
        <label class="l">集合場所</label><textarea rows="2" data-f="meetingPlace"></textarea>
        <label class="l">集合時間</label><input type="text" data-f="meetingTime" placeholder="例：開始10分前">
        <div class="row"><div><label class="l">集合担当（名前）</label><input type="text" data-f="contactName" placeholder="例：前田"></div><div><label class="l">集合担当（電話番号）</label><input type="tel" data-f="contactPhone" placeholder="例：090-0000-0000"></div></div>
        <label class="l">服装</label><input type="text" data-f="dress">
        <div class="row"><div><label class="l">ギャランティ</label><input type="text" data-f="pay" placeholder="例：時給1180円＋交通費"></div><div><label class="l">昼食</label><input type="text" data-f="meal" placeholder="例：500円支給"></div></div>
        <label class="l">持ち物</label><input type="text" data-f="belongings">
        <label class="l">画像（地図・集合場所の写真など。3枚まで。本文のあとに送ります）</label>
        <div id="images" class="images"></div>
        <label class="pick" id="pickLabel"><input type="file" id="pick" accept="image/jpeg,image/png" multiple hidden>＋ 画像を選ぶ</label>
        <span id="upStatus" class="hint"></span>
      </div>
      <div>
        <h2>送る人</h2>
        <div id="staff" class="staff"></div>
        <h2>プレビュー <span id="pvName" class="hint"></span></h2>
        <div id="preview" class="preview"></div>
      </div>
    </div>
  </div>
  <div class="bar">
    <button id="pv">プレビューを更新</button>
    <button id="send" class="primary" disabled>送る</button>
    <button onclick="google.script.host.close()">閉じる</button>
    <span class="hint">送ったあと、交通費（往復）と出発時間の返信が「案件応募」に自動で入ります。</span>
  </div>

<script>
var data = null, current = null;
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function showMsg(text, kind) { var m = $('msg'); m.textContent = text; m.className = 'msg ' + (kind || 'err'); }
var MAX_IMAGES = 3;
var images = []; // { id, url }（url は画面に表示する画像）
function fields() {
  var f = {};
  Array.prototype.forEach.call(document.querySelectorAll('[data-f]'), function (el) { f[el.dataset.f] = el.value; });
  f.images = images.map(function (x) { return x.id; });
  return f;
}

function renderImages() {
  $('images').innerHTML = images.map(function (x, i) {
    return '<div class="thumb"><img src="' + esc(x.url) + '" alt=""><button data-del-img="' + i + '" title="外す">×</button></div>';
  }).join('');
  $('pickLabel').className = 'pick' + (images.length >= MAX_IMAGES ? ' off' : '');
}

// 長い辺を1600pxまでに縮小して JPEG にする（LINE の画像の上限と送信時間のため）
function shrink(file) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onerror = function () { reject(new Error('画像を読み込めませんでした')); };
    reader.onload = function () {
      var img = new Image();
      img.onerror = function () { reject(new Error('画像を読み込めませんでした（JPEG か PNG を選んでください）')); };
      img.onload = function () {
        var scale = Math.min(1, 1600 / Math.max(img.width, img.height));
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        var g = canvas.getContext('2d');
        g.fillStyle = '#fff';
        g.fillRect(0, 0, canvas.width, canvas.height);
        g.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

$('pick').onchange = function () {
  var files = Array.prototype.slice.call(this.files, 0, MAX_IMAGES - images.length);
  this.value = '';
  if (!files.length) return;
  $('send').disabled = true;
  var next = function () {
    var file = files.shift();
    if (!file) { $('upStatus').textContent = ''; preview(); return; }
    $('upStatus').textContent = '画像を保存しています…';
    shrink(file).then(function (dataUrl) {
      google.script.run.withSuccessHandler(function (r) {
        images.push({ id: r.id, url: dataUrl });
        renderImages();
        next();
      }).withFailureHandler(function (e) { $('upStatus').textContent = ''; showMsg(e.message); preview(); })
        .uploadDetailImage({ name: file.name.replace(/\.\w+$/, '') + '.jpg', mimeType: 'image/jpeg', data: dataUrl.split(',')[1] });
    }).catch(function (e) { $('upStatus').textContent = ''; showMsg(e.message); preview(); });
  };
  next();
};
function checked() {
  return Array.prototype.map.call(document.querySelectorAll('input[name=staff]:checked'), function (x) { return x.value; });
}

google.script.run.withSuccessHandler(function (r) {
  data = r;
  if (!r.cases.length) { $('empty').style.display = 'block'; return; }
  $('main').style.display = 'block';
  var sel = 0;
  r.cases.forEach(function (c, i) { if (c.selected && !sel) sel = i; });
  $('case').innerHTML = r.cases.map(function (c, i) {
    return '<option value="' + i + '"' + (i === sel ? ' selected' : '') + '>' + esc(c.title) + '（確定 ' + c.staff.length + '人）</option>';
  }).join('');
  pick(sel);
}).withFailureHandler(function (e) { showMsg(e.message); }).detailSendInit();

$('case').onchange = function () { pick(+this.value); };

function pick(i) {
  current = data.cases[i];
  Array.prototype.forEach.call(document.querySelectorAll('[data-f]'), function (el) { el.value = current.fields[el.dataset.f] || ''; });
  images = (current.fields.images || []).map(function (id) { return { id: id, url: 'https://lh3.googleusercontent.com/d/' + encodeURIComponent(id) }; });
  renderImages();
  $('staff').innerHTML = current.staff.map(function (s) {
    var state = s.fare !== '' && s.departure ? '<span class="got">返信済み：交通費 ' + esc(s.fare) + '円・出発 ' + esc(s.departure) + '</span>'
      : s.sent ? '<span class="sent">送信済み（返信待ち）</span>' : '';
    return '<label><input type="checkbox" name="staff" value="' + esc(s.userId) + '"' + (s.sent ? '' : ' checked') + '> ' +
      esc(s.name) + '　' + esc(s.dates) + ' ' + state + '</label>';
  }).join('');
  preview();
}

function preview() {
  if (!current) return;
  var ids = checked();
  $('send').disabled = true;
  google.script.run.withSuccessHandler(function (r) {
    $('pvName').textContent = '（' + r.name + ' さんの場合）';
    $('preview').innerHTML = '<div class="bubble">' + esc(r.text) + '</div>' +
      images.map(function (x) { return '<div class="bubble"><img src="' + esc(x.url) + '" alt=""></div>'; }).join('') +
      '<div class="bubble">' + esc(r.request) + '</div>';
    var n = checked().length;
    $('send').disabled = !n;
    $('send').textContent = n ? n + '人に送る' : '送る';
  }).withFailureHandler(function (e) { showMsg(e.message); })
    .detailPreview({ caseId: current.caseId, userId: ids[0] || '', fields: fields() });
}

$('pv').onclick = preview;
document.addEventListener('change', function (e) { if (e.target.name === 'staff') preview(); });
document.addEventListener('click', function (e) {
  var i = e.target.dataset && e.target.dataset.delImg;
  if (i === undefined) return;
  images.splice(+i, 1);
  renderImages();
  preview();
});
document.addEventListener('input', function (e) { if (e.target.dataset && e.target.dataset.f) $('send').disabled = true; });

$('send').onclick = function () {
  var ids = checked();
  if (!ids.length) return;
  $('send').disabled = true;
  $('send').textContent = '送信中…';
  google.script.run.withSuccessHandler(function (r) {
    showMsg((r.sent.length ? r.sent.join('、') + ' さんに送りました。' : '') +
      (r.failed.length ? '\n' + r.failed.join('、') + ' さんには送れませんでした（シート「エラーログ」を確認してください）。' : ''), r.failed.length ? 'err' : 'info');
    $('send').textContent = '送る';
    google.script.run.withSuccessHandler(function (d) {
      data = d;
      var i = Math.max(0, d.cases.findIndex(function (c) { return c.caseId === current.caseId; }));
      if (d.cases.length) pick(i);
    }).detailSendInit();
  }).withFailureHandler(function (e) {
    $('send').disabled = false;
    $('send').textContent = '送る';
    showMsg(e.message);
  }).detailSend({ caseId: current.caseId, userIds: ids, fields: fields() });
};
</script>
</body>
</html>
